<svg width="100%" viewBox="0 0 1240 695" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Smooth rounded corners -->
    <clipPath id="rounded-corners">
      <rect x="20" y="20" width="1200" height="655" rx="24" ry="24" />
    </clipPath>

    <!-- White outer glow filter -->
    <filter id="white-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Glowing white rounded border -->
  <rect x="20" y="20" width="1200" height="655" rx="24" ry="24" fill="#0d0517" stroke="#FFFFFF" stroke-width="3" filter="url(#white-glow)" />

  <!-- Banner Image clipped inside the rounded frame -->
  
</svg>