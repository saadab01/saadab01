name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ saadab01}}
          
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=ff6ad5&color_dots=3a1a63,5a189a,7b2cbf,9d4edd,c77dff&color_dot_border=0d0517
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
